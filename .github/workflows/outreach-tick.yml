# Manual outreach tick. The schedule now runs in Supabase (pg_cron + pg_net every 5 minutes, bearer
# secret in Vault; migration 20261116190000), which is on time where GitHub's cron was often delayed.
# Kept for "Run workflow" by hand; no schedule here, so two ticks never race on a send.
name: Outreach tick

on:
  workflow_dispatch:

concurrency:
  group: outreach-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/outreach/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET repository secret is not set"; exit 1; fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" https://hamzatariq.site/api/outreach/tick)
          cat response.json; echo
          test "$status" = "200"
