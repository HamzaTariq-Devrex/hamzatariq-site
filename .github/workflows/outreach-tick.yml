# Outreach scheduler (free on a public repo): Vercel Hobby crons run at most once a day, so this
# calls the protected tick endpoint every 5 minutes. Each tick: hourly inbox check (replies,
# bounces, unsubscribes), auto-pause, at most ONE email (Mon-Fri 9-17 in the recipient's time
# zone, 3-8 minute gaps, daily cap), one site audit, drafts and follow-ups.
# GitHub may delay scheduled runs; the endpoint's own rules decide what happens.
name: Outreach tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: outreach-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/outreach/tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET repository secret is not set"; exit 1; fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" https://hamzatariq.site/api/outreach/tick)
          cat response.json; echo
          test "$status" = "200"
